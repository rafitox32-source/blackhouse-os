name: CI/CD & Semantic Release (Electron)

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install || npm ci

      - name: Ejecutar Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-windows:
    name: Build y publicar instalador de Windows
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código (rama main actualizada por semantic-release)
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install || npm ci

      - name: Generar archivo .env con credenciales
        shell: pwsh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          $faltantes = @()
          if ([string]::IsNullOrWhiteSpace($env:GROQ_API_KEY)) { $faltantes += "GROQ_API_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { $faltantes += "SUPABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_KEY)) { $faltantes += "SUPABASE_KEY" }
          if ($faltantes.Count -gt 0) {
            Write-Error "Faltan secrets obligatorios en GitHub Actions: $($faltantes -join ', '). Abortando build para no publicar un instalador que no puede loguear a nadie."
            exit 1
          }

          $lines = @(
            "GROQ_API_KEY=$env:GROQ_API_KEY",
            "SUPABASE_URL=$env:SUPABASE_URL",
            "SUPABASE_KEY=$env:SUPABASE_KEY",
            "GEMINI_API_KEY=$env:GEMINI_API_KEY",
            "EMAIL_USER=$env:EMAIL_USER",
            "EMAIL_PASS=$env:EMAIL_PASS"
          )
          Set-Content -Path .env -Value $lines -Encoding utf8

      - name: Build y publicar instalador (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
