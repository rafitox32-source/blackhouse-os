name: CI/CD & Semantic Release (Electron)

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install || npm ci

      - name: Ejecutar Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-windows:
    name: Build y publicar instalador de Windows
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código (rama main actualizada por semantic-release)
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install || npm ci

      - name: Generar archivo .env con credenciales
        shell: pwsh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          $faltantes = @()
          if ([string]::IsNullOrWhiteSpace($env:GROQ_API_KEY)) { $faltantes += "GROQ_API_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { $faltantes += "SUPABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_KEY)) { $faltantes += "SUPABASE_KEY" }
          if ($faltantes.Count -gt 0) {
            Write-Error "Faltan secrets obligatorios en GitHub Actions: $($faltantes -join ', '). Abortando build para no publicar un instalador que no puede loguear a nadie."
            exit 1
          }

          # Detecta el error de haber pegado "NOMBRE=valor" completo en vez de solo "valor"
          # al crear el secret en GitHub (ya nos paso una vez).
          $malFormados = @()
          if ($env:GROQ_API_KEY -match '^\s*GROQ_API_KEY\s*=') { $malFormados += "GROQ_API_KEY" }
          if ($env:SUPABASE_URL -match '^\s*SUPABASE_URL\s*=') { $malFormados += "SUPABASE_URL" }
          if ($env:SUPABASE_KEY -match '^\s*SUPABASE_KEY\s*=') { $malFormados += "SUPABASE_KEY" }
          if ($malFormados.Count -gt 0) {
            Write-Error "Estos secrets tienen el nombre de la variable pegado dentro del valor: $($malFormados -join ', '). Edita el secret en GitHub y deja SOLO el valor, sin 'NOMBRE=' al inicio."
            exit 1
          }

          # SUPABASE_URL debe ser una URL http(s) valida, no cualquier texto.
          try {
            $uri = [System.Uri]::new($env:SUPABASE_URL)
            if ($uri.Scheme -notin @('http','https')) { throw "esquema invalido" }
          } catch {
            Write-Error "SUPABASE_URL no es una URL http(s) valida. Revisa el valor del secret en GitHub."
            exit 1
          }

          $lines = @(
            "GROQ_API_KEY=$env:GROQ_API_KEY",
            "SUPABASE_URL=$env:SUPABASE_URL",
            "SUPABASE_KEY=$env:SUPABASE_KEY",
            "GEMINI_API_KEY=$env:GEMINI_API_KEY",
            "EMAIL_USER=$env:EMAIL_USER",
            "EMAIL_PASS=$env:EMAIL_PASS"
          )
          Set-Content -Path .env -Value $lines -Encoding utf8

      - name: Build y publicar instalador (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
